[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horcrux"
version = "1.0.0"
description = "Wide-scoped offensive-security operator console for authorized assessments"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.scripts]
horcrux = "horcrux.cli:main"

[tool.setuptools.packages.find]
include = ["horcrux*"]
